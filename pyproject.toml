[build-system]
requires      = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name           = "runledger-cli"
version        = "0.1.0"
description    = "Zero‑instrumentation experiment registry CLI"
readme         = "README.md"
requires-python = ">=3.10"
dependencies   = [
    "requests",
    "rich",
]
[project.scripts]
runledger      = "cli.ledger:main"

[tool.setuptools.packages.find]
include = ["cli", "cli.*"]