[build-system]
requires      = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name           = "runledger-cli"
version        = "0.2.1"
description    = "Self-hosted SQL-style query engine over your team's experiment JSON"
readme         = "README.md"
requires-python = ">=3.10"
license        = { text = "MIT" }
authors        = [{ name = "Ahmed Rafat" }]
keywords       = ["experiments", "json", "postgresql", "sql", "ml", "research", "cli"]
classifiers    = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Java",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
]
dependencies   = [
    "requests",
    "rich",
]

[project.urls]
Repository   = "https://github.com/ahmedrafatcse/run-ledger"
Documentation = "https://github.com/ahmedrafatcse/run-ledger/tree/master/docs"
Issues       = "https://github.com/ahmedrafatcse/run-ledger/issues"
Changelog    = "https://github.com/ahmedrafatcse/run-ledger/releases"

[project.scripts]
runledger      = "cli.ledger:main"

[tool.setuptools.packages.find]
include = ["cli", "cli.*"]

[tool.setuptools.package-data]
cli = ["docker-compose.yml"]