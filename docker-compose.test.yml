services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: runledger
      POSTGRES_USER: runledger
      POSTGRES_PASSWORD: runledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  app:
    build: .
    ports:
      - "8080"               # random host port → container 8080, no conflicts ever
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/runledger
      SPRING_DATASOURCE_USERNAME: runledger
      SPRING_DATASOURCE_PASSWORD: runledger
    depends_on:
      postgres:
        condition: service_healthy